[project]
name = "pyromaniac"
version = "0.6.0"
description = "Framework and Toolkit for Modular Fedora CoreOS Configurations"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "salatfreak" }]

requires-python = ">=3.12"
dependencies = [
  "PyYAML ~= 6.0.3",
  "Jinja2 ~= 3.1.6",
  "cryptography ~= 50.0.0",
]

[tool.setuptools]
packages = ["pyromaniac"]

[tool.ruff]
target-version = "py312"
lint = { select = ["F", "E", "W"], preview = true }

[tool.ty.environment]
python-version = "3.12"
