[project]
name = "pyromaniac"
version = "0.5.0"
description = "Obsessed with creating Ignition"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "salatfreak" }]

requires-python = ">=3.11"
dependencies = [
  "PyYAML ~= 6.0.3",
  "Jinja2 ~= 3.1.6",
  "cryptography ~= 46.0.3",
]

[tool.setuptools]
packages = ["pyromaniac"]

[tool.ruff]
target-version = "py311"
lint = { select = ["F", "E", "W"], preview = true }

[tool.ty.environment]
python-version = "3.11"
